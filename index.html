<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔪 ARUSH GAMERZ - MAFIA KINGDOM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a2e;
            --primary: #ff4757;
            --primary-dark: #c0392b;
            --success: #2ed573;
            --warning: #ffa502;
            --info: #1e90ff;
            --text: #ffffff;
            --text-dim: #aaa;
        }

        body {
            background: var(--tg-theme-bg-color, #0a0a0a);
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 11px;
            color: #ccc;
        }

        .coins-display {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .room-code {
            background: #ff4757;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 11px;
            color: white;
        }

        .copy-btn, .close-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-btn { background: #2ed573; }
        .close-btn { background: #e74c3c; }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .mode-btn.solo { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }
        .mode-btn.duo { background: linear-gradient(135deg, #fd79a8, #e84393); color: white; }
        .mode-btn.multi { background: linear-gradient(135deg, #00cec9, #0984e3); color: white; }

        .role-card {
            background: linear-gradient(135deg, #2c2c3e, #1e1e2a);
            border-radius: 32px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .role-icon { font-size: 48px; margin-bottom: 8px; }
        .role-name { font-size: 22px; font-weight: bold; color: white; }
        .role-desc { font-size: 11px; color: #aaa; }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin: 15px 0;
            max-height: 260px;
            overflow-y: auto;
        }

        .player-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .player-card.alive { border-color: #2ed573; background: rgba(46,213,115,0.1); }
        .player-card.dead { opacity: 0.5; background: rgba(255,71,87,0.1); }
        .player-card.selected { border-color: #ffa502; background: rgba(255,165,2,0.2); transform: scale(1.02); }

        .player-name { font-weight: bold; font-size: 12px; color: white; }
        .player-status { font-size: 10px; margin-top: 4px; }
        .player-status.alive { color: #2ed573; }
        .player-status.dead { color: #ff4757; }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #ff4757, #c0392b);
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active { transform: scale(0.96); }
        .action-btn.secondary { background: linear-gradient(135deg, #1e90ff, #0c5fbf); }
        .action-btn.success { background: linear-gradient(135deg, #2ed573, #0a8f4a); }
        .action-btn.warning { background: linear-gradient(135deg, #e67e22, #d35400); }
        .action-btn:disabled { opacity: 0.5; }

        .game-log {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-size: 11px;
            font-family: monospace;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #bbb;
        }

        .phase-indicator {
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
        }

        .phase-day { background: rgba(30,144,255,0.3); color: #74b9ff; }
        .phase-night { background: rgba(0,0,0,0.6); color: #ff6b81; }
        .phase-waiting { background: rgba(255,165,2,0.3); color: #ffa502; }

        .join-screen, .mode-screen { text-align: center; }
        .join-input {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            background: #2c2c3e;
            color: white;
            font-size: 16px;
            text-align: center;
            margin: 15px 0;
        }
        .hidden { display: none; }

        @keyframes glow {
            0% { box-shadow: 0 0 5px #ffa502; }
            100% { box-shadow: 0 0 20px #ffa502; }
        }
        .glow { animation: glow 0.5s ease-in-out infinite alternate; }

        .owner-badge, .host-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 20px;
            margin-left: 5px;
        }
        .owner-badge { background: #ffd700; color: #1a1a2e; }
        .host-badge { background: #1e90ff; color: white; }

        .status-banner {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 8px;
            text-align: center;
            margin: 10px 0;
            font-size: 12px;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="game-container">
    <!-- Mode Selection -->
    <div id="modeScreen" class="join-screen">
        <div class="role-icon">🎭</div>
        <h2 style="color:white">ARUSH GAMERZ</h2>
        <p style="color:#aaa; margin:10px 0">Choose your battle mode</p>
        <div class="mode-selector">
            <button id="soloModeBtn" class="mode-btn solo">🎮 SOLO<br><small>vs BOT</small></button>
            <button id="duoModeBtn" class="mode-btn duo">⚔️ DUO<br><small>2 Players</small></button>
            <button id="multiModeBtn" class="mode-btn multi">👥 MULTI<br><small>4-6 Players</small></button>
        </div>
    </div>

    <!-- Join Screen -->
    <div id="joinScreen" class="join-screen hidden">
        <div class="role-icon">🔑</div>
        <h2 style="color:white" id="joinTitle">Join Game</h2>
        <input type="text" id="roomCodeInput" class="join-input" placeholder="Enter Room Code">
        <button id="joinRoomBtn" class="action-btn">🔑 Join Room</button>
        <button id="createRoomBtn" class="action-btn secondary">✨ Create New Room</button>
        <button id="backToModeBtn" class="action-btn warning" style="margin-top:10px">⬅️ Back</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
        <div class="game-header">
            <div class="user-badge" id="userInfo">👤 Loading...</div>
            <div class="coins-display">🪙 <span id="coinsAmount">0</span></div>
            <div style="display: flex; gap: 6px;">
                <div class="room-code" id="roomDisplay">---</div>
                <button id="copyRoomBtn" class="copy-btn hidden">📋</button>
                <button id="closeRoomBtn" class="close-btn hidden">🔒 Close</button>
            </div>
        </div>

        <div class="role-card">
            <div class="role-icon" id="roleIcon">❓</div>
            <div class="role-name" id="roleName">Waiting...</div>
            <div class="role-desc" id="roleDesc">Game starting soon</div>
        </div>

        <div class="phase-indicator" id="phaseIndicator">
            <span id="phaseText">⏳ Waiting...</span>
        </div>

        <div class="status-banner" id="statusBanner"></div>

        <div class="players-grid" id="playersGrid"></div>

        <div class="action-buttons">
            <button id="actionBtn" class="action-btn" disabled>⏳ Wait...</button>
            <button id="voteBtn" class="action-btn secondary" disabled>🗳️ Vote</button>
        </div>

        <div class="game-log" id="gameLog">
            <div class="log-entry">🎭 Welcome to ARUSH GAMERZ!</div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.MainButton.hide();

    // ==================== OWNER ID ====================
    const OWNER_ID = '1134292389';
    
    // ==================== COINS SYSTEM ====================
    let userCoins = localStorage.getItem('arush_coins') ? parseInt(localStorage.getItem('arush_coins')) : 100;
    document.getElementById('coinsAmount').innerText = userCoins;
    
    function updateCoins(amount) {
        userCoins += amount;
        localStorage.setItem('arush_coins', userCoins);
        document.getElementById('coinsAmount').innerText = userCoins;
        addLog(`💰 ${amount > 0 ? '+' : ''}${amount} coins! Total: ${userCoins}`);
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // ==================== PLAYER DATA ====================
    let currentUser = {
        id: 'anonymous',
        name: 'Guest',
        role: null,
        isAlive: true,
        roomCode: null,
        isHost: false,
        isOwner: false
    };

    let gameState = {
        mode: null,
        phase: 'waiting',
        players: [],
        currentRoom: null,
        hostId: null,
        gameStarted: false,
        autoStartTimer: null
    };

    let selectedPlayerId = null;
    let myRoleAction = null;

    // Get Telegram User
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        currentUser.id = user.id.toString();
        currentUser.name = user.first_name + (user.last_name ? ' ' + user.last_name : '');
        currentUser.isOwner = (currentUser.id === OWNER_ID);
        document.getElementById('userInfo').innerHTML = `👤 ${currentUser.name} ${currentUser.isOwner ? '<span class="owner-badge">👑 OWNER</span>' : ''}`;
    } else {
        currentUser.id = 'player_' + Math.random().toString(36).substr(2, 6);
        currentUser.name = 'Player';
    }

    // Room storage
    let rooms = JSON.parse(localStorage.getItem('arush_rooms') || '{}');

    function saveRooms() { localStorage.setItem('arush_rooms', JSON.stringify(rooms)); }
    function generateRoomCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

    // ==================== SOLO MODE ====================
    function startSoloMode() {
        gameState.mode = 'solo';
        gameState.phase = 'night';
        
        const botNames = ['Shadow Killer', 'Ghost Mafia', 'Viper', 'Dark Wolf'];
        gameState.players = [
            { id: currentUser.id, name: currentUser.name, role: 'villager', isAlive: true, isBot: false },
            { id: 'bot1', name: botNames[0], role: 'mafia', isAlive: true, isBot: true },
            { id: 'bot2', name: botNames[1], role: 'mafia', isAlive: true, isBot: true },
            { id: 'bot3', name: botNames[2], role: 'villager', isAlive: true, isBot: true },
            { id: 'bot4', name: botNames[3], role: 'villager', isAlive: true, isBot: true }
        ];
        
        currentUser.role = 'villager';
        gameState.gameStarted = true;
        
        document.getElementById('modeScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('roomDisplay').innerHTML = 'SOLO MODE 🎮';
        document.getElementById('copyRoomBtn').classList.add('hidden');
        document.getElementById('closeRoomBtn').classList.add('hidden');
        
        updateRoleUI();
        updatePlayersList();
        addLog('🎮 SOLO MODE Started! You are VILLAGER');
        addLog('🔪 Two bots are MAFIAS! Find them!');
        updateCoins(50);
        startNightPhase();
    }

    // ==================== CREATE/JOIN ROOM ====================
    function createRoom() {
        const roomCode = generateRoomCode();
        let maxPlayers, minPlayers;
        
        if (gameState.mode === 'duo') {
            maxPlayers = 2;
            minPlayers = 2;
        } else {
            maxPlayers = 6;
            minPlayers = 4;
        }
        
        rooms[roomCode] = {
            code: roomCode,
            mode: gameState.mode,
            hostId: currentUser.id,
            minPlayers: minPlayers,
            maxPlayers: maxPlayers,
            players: [{ id: currentUser.id, name: currentUser.name, role: null, isAlive: true }],
            phase: 'waiting',
            gameStarted: false,
            createdAt: Date.now()
        };
        saveRooms();
        joinRoom(roomCode);
        addLog(`🎮 Room created! Code: ${roomCode}`);
        addLog(`👥 Need ${minPlayers} players to start (${maxPlayers} max)`);
    }

    function closeRoom() {
        const room = rooms[currentUser.roomCode];
        if (!room || (!currentUser.isOwner && !currentUser.isHost)) {
            addLog('❌ Only room owner can close the room!');
            return;
        }
        
        if (gameState.gameStarted) {
            addLog('❌ Cannot close room after game started!');
            return;
        }
        
        delete rooms[currentUser.roomCode];
        saveRooms();
        addLog('🔒 Room closed! Returning to menu...');
        tg.showPopup({ title: 'Room Closed', message: 'Room has been closed by owner', buttons: [{type: 'ok'}] });
        
        setTimeout(() => {
            location.reload();
        }, 2000);
    }

    function joinRoom(roomCode) {
        const room = rooms[roomCode.toUpperCase()];
        if (!room) {
            addLog('❌ Room not found!');
            if (tg.showPopup) tg.showAlert('Room not found!');
            return false;
        }
        
        if (room.gameStarted) {
            addLog('❌ Game already started!');
            return false;
        }
        
        if (room.players.length >= room.maxPlayers) {
            addLog('❌ Room is full!');
            if (tg.showPopup) tg.showAlert('Room is full!');
            return false;
        }
        
        if (!room.players.find(p => p.id === currentUser.id)) {
            room.players.push({ id: currentUser.id, name: currentUser.name, role: null, isAlive: true });
            saveRooms();
            addLog(`✅ ${currentUser.name} joined the room!`);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
        
        currentUser.roomCode = roomCode.toUpperCase();
        gameState.mode = room.mode;
        gameState.currentRoom = roomCode.toUpperCase();
        gameState.players = room.players;
        gameState.hostId = room.hostId;
        currentUser.isHost = (currentUser.id === room.hostId);
        
        document.getElementById('roomDisplay').innerHTML = `ROOM: ${roomCode.toUpperCase()}`;
        document.getElementById('joinScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('copyRoomBtn').classList.remove('hidden');
        document.getElementById('closeRoomBtn').classList.remove('hidden');
        document.getElementById('copyRoomBtn').onclick = () => copyRoomCode(roomCode.toUpperCase());
        document.getElementById('closeRoomBtn').onclick = () => closeRoom();
        
        // Show/hide close button based on ownership
        if (!currentUser.isOwner && !currentUser.isHost) {
            document.getElementById('closeRoomBtn').style.display = 'none';
        } else {
            document.getElementById('closeRoomBtn').style.display = 'block';
        }
        
        updatePlayersList();
        updateStatusBanner();
        
        // ========== AUTO-START WHEN FULL ==========
        if (!room.gameStarted && room.players.length >= room.minPlayers) {
            if (currentUser.isOwner || currentUser.isHost) {
                addLog(`🎉 ${room.players.length}/${room.maxPlayers} players! Starting game automatically in 3 seconds...`);
                document.getElementById('statusBanner').innerHTML = `🎉 ${room.players.length}/${room.maxPlayers} players! Auto-starting... 🎉`;
                
                if (gameState.autoStartTimer) clearTimeout(gameState.autoStartTimer);
                gameState.autoStartTimer = setTimeout(() => {
                    if (!room.gameStarted && rooms[currentUser.roomCode]) {
                        startMultiGame();
                    }
                }, 3000);
            } else {
                addLog(`🎉 ${room.players.length}/${room.maxPlayers} players! Waiting for host to start...`);
                document.getElementById('statusBanner').innerHTML = `🎉 ${room.players.length}/${room.maxPlayers} players! Host will start soon 🎉`;
            }
        } else if (!room.gameStarted) {
            const remaining = room.minPlayers - room.players.length;
            addLog(`👥 Need ${remaining} more player${remaining > 1 ? 's' : ''} to start...`);
            document.getElementById('statusBanner').innerHTML = `👥 Need ${remaining} more player${remaining > 1 ? 's' : ''} to start`;
        }
        
        // Show start button for owner/host
        if (!room.gameStarted && (currentUser.isOwner || currentUser.isHost)) {
            const startBtn = document.getElementById('actionBtn');
            startBtn.innerText = '🎮 START GAME';
            startBtn.disabled = false;
            startBtn.classList.add('success');
            startBtn.onclick = startMultiGame;
            startBtn.classList.add('glow');
        } else if (!room.gameStarted) {
            document.getElementById('actionBtn').innerText = '⏳ Waiting for Host...';
            document.getElementById('actionBtn').disabled = true;
        }
        
        return true;
    }

    function updateStatusBanner() {
        const room = rooms[currentUser.roomCode];
        if (!room || room.gameStarted) return;
        
        const banner = document.getElementById('statusBanner');
        if (room.players.length >= room.minPlayers) {
            banner.innerHTML = `✅ ${room.players.length}/${room.maxPlayers} players - READY TO START! ✅`;
            banner.style.background = 'rgba(46,213,115,0.3)';
        } else {
            banner.innerHTML = `⏳ ${room.players.length}/${room.minPlayers} players needed to start`;
            banner.style.background = 'rgba(0,0,0,0.7)';
        }
    }

    function startMultiGame() {
        const room = rooms[currentUser.roomCode];
        if (!room) return;
        
        if (!currentUser.isOwner && !currentUser.isHost) {
            addLog('❌ Only Room Owner can start the game!');
            if (tg.showPopup) tg.showAlert('Only Room Owner can start the game!');
            return;
        }
        
        if (room.players.length < room.minPlayers) {
            addLog(`⚠️ Need at least ${room.minPlayers} players! Currently: ${room.players.length}`);
            if (tg.showPopup) tg.showAlert(`Need ${room.minPlayers} players to start!`);
            return;
        }
        
        if (room.gameStarted) {
            addLog('❌ Game already started!');
            return;
        }
        
        const players = room.players;
        const playerCount = players.length;
        let mafiaCount = room.mode === 'duo' ? 1 : Math.floor(playerCount / 2);
        if (mafiaCount < 1) mafiaCount = 1;
        
        let roles = [];
        for (let i = 0; i < mafiaCount; i++) roles.push('mafia');
        roles.push('doctor');
        roles.push('cop');
        while (roles.length < playerCount) roles.push('villager');
        
        const shuffledRoles = roles.sort(() => Math.random() - 0.5);
        players.forEach((p, idx) => { p.role = shuffledRoles[idx]; });
        
        room.gameStarted = true;
        room.phase = 'day';
        saveRooms();
        
        updateGameUI();
        addLog('🎬 GAME STARTED! Check your role!');
        updateCoins(100);
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
        document.getElementById('actionBtn').classList.remove('glow');
        document.getElementById('closeRoomBtn').style.display = 'none';
        document.getElementById('statusBanner').innerHTML = '🎮 GAME IN PROGRESS 🎮';
    }

    function copyRoomCode(code) {
        navigator.clipboard.writeText(code);
        if (tg.showPopup) tg.showPopup({ title: 'Copied!', message: `Room Code: ${code}`, buttons: [{type: 'ok'}] });
    }

    // ==================== GAME UI FUNCTIONS ====================
    function updateGameUI() {
        if (gameState.mode === 'solo') { updatePlayersList(); return; }
        const room = rooms[currentUser.roomCode];
        if (!room) return;
        
        const myPlayer = room.players.find(p => p.id === currentUser.id);
        if (myPlayer) {
            currentUser.role = myPlayer.role;
            currentUser.isAlive = myPlayer.isAlive;
            updateRoleUI();
        }
        gameState.phase = room.phase;
        gameState.gameStarted = room.gameStarted;
        updatePhaseUI();
        updatePlayersList();
        updateActionButtons();
    }

    function updateRoleUI() {
        const roles = {
            mafia: { icon: '🔪', name: 'MAFIA', desc: 'Kill one player at night', action: 'kill' },
            doctor: { icon: '💊', name: 'DOCTOR', desc: 'Save one player at night', action: 'heal' },
            cop: { icon: '🔍', name: 'COP', desc: 'Investigate a player', action: 'investigate' },
            villager: { icon: '👨‍🌾', name: 'VILLAGER', desc: 'Vote during the day', action: null }
        };
        const info = roles[currentUser.role] || roles.villager;
        document.getElementById('roleIcon').innerHTML = info.icon;
        document.getElementById('roleName').innerHTML = info.name;
        document.getElementById('roleDesc').innerHTML = info.desc;
        myRoleAction = info.action;
    }

    function updatePhaseUI() {
        const phaseText = document.getElementById('phaseText');
        const phaseDiv = document.getElementById('phaseIndicator');
        if (!gameState.gameStarted) {
            phaseText.innerHTML = '⏳ Waiting to start...';
            phaseDiv.className = 'phase-indicator phase-waiting';
        } else if (gameState.phase === 'day') {
            phaseText.innerHTML = '☀️ DAY - Vote to eliminate';
            phaseDiv.className = 'phase-indicator phase-day';
        } else if (gameState.phase === 'night') {
            phaseText.innerHTML = '🌙 NIGHT - Use your ability';
            phaseDiv.className = 'phase-indicator phase-night';
        }
    }

    function updatePlayersList() {
        const players = gameState.mode === 'solo' ? gameState.players : (rooms[currentUser.roomCode]?.players || []);
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';
        
        players.forEach(player => {
            const card = document.createElement('div');
            card.className = `player-card ${player.isAlive ? 'alive' : 'dead'}`;
            if (selectedPlayerId === player.id) card.classList.add('selected');
            
            let roleHint = '';
            if (gameState.mode === 'solo' && !player.isAlive && player.role) {
                roleHint = `<div style="font-size:8px;color:#ffa502;margin-top:2px">${player.role === 'mafia' ? '🔪 MAFIA' : '👨‍🌾 TOWN'}</div>`;
            }
            
            card.innerHTML = `
                <div class="player-name">${player.name} ${player.isBot ? '🤖' : ''}</div>
                <div class="player-status ${player.isAlive ? 'alive' : 'dead'}">${player.isAlive ? '🟢 Alive' : '💀 Dead'}</div>
                ${roleHint}
            `;
            
            if (player.isAlive && player.id !== currentUser.id && gameState.gameStarted && gameState.phase !== 'waiting') {
                card.style.cursor = 'pointer';
                card.onclick = () => {
                    selectedPlayerId = player.id;
                    updatePlayersList();
                    if (gameState.phase === 'day') document.getElementById('voteBtn').disabled = false;
                    else if (gameState.phase === 'night' && myRoleAction && currentUser.isAlive) document.getElementById('actionBtn').disabled = false;
                };
            }
            grid.appendChild(card);
        });
    }

    function updateActionButtons() {
        const voteBtn = document.getElementById('voteBtn');
        const actionBtn = document.getElementById('actionBtn');
        
        if (!gameState.gameStarted && gameState.mode !== 'solo') {
            if ((currentUser.isOwner || currentUser.isHost) && rooms[currentUser.roomCode]) {
                actionBtn.innerText = '🎮 START GAME';
                actionBtn.disabled = false;
                actionBtn.classList.add('success');
                actionBtn.onclick = startMultiGame;
            } else {
                actionBtn.innerText = '⏳ Waiting for Host...';
                actionBtn.disabled = true;
            }
            voteBtn.disabled = true;
            return;
        }
        
        if (!currentUser.isAlive) {
            actionBtn.innerText = '⚰️ You are dead';
            actionBtn.disabled = true;
            voteBtn.disabled = true;
            return;
        }
        
        if (gameState.phase === 'day') {
            actionBtn.innerText = '☀️ Day - Vote below';
            actionBtn.disabled = true;
            voteBtn.disabled = !selectedPlayerId;
            voteBtn.innerText = '🗳️ VOTE';
            voteBtn.onclick = () => { if (selectedPlayerId) performVote(); };
        } else if (gameState.phase === 'night') {
            voteBtn.disabled = true;
            if (myRoleAction && selectedPlayerId) {
                actionBtn.disabled = false;
                actionBtn.innerText = myRoleAction === 'kill' ? '🔪 KILL' : (myRoleAction === 'heal' ? '💊 SAVE' : '🔍 INVESTIGATE');
                actionBtn.onclick = performNightAction;
            } else {
                actionBtn.disabled = true;
                actionBtn.innerText = '🌙 Select a player';
            }
        }
    }

    function performVote() {
        if (!selectedPlayerId) return;
        const room = rooms[currentUser.roomCode];
        if (room) {
            const target = room.players.find(p => p.id === selectedPlayerId);
            if (target && target.isAlive) {
                target.isAlive = false;
                addLog(`🗳️ ${currentUser.name} voted to eliminate ${target.name}`);
                updateCoins(20);
                checkWinCondition(room);
                room.phase = 'night';
                saveRooms();
                updateGameUI();
            }
        }
        selectedPlayerId = null;
        updatePlayersList();
        updateActionButtons();
    }

    function performNightAction() {
        if (!selectedPlayerId || !myRoleAction) return;
        const room = rooms[currentUser.roomCode];
        if (room) {
            const target = room.players.find(p => p.id === selectedPlayerId);
            if (target && target.isAlive) {
                if (myRoleAction === 'kill') {
                    target.isAlive = false;
                    addLog(`🔪 MAFIA killed ${target.name}!`);
                    updateCoins(30);
                } else if (myRoleAction === 'heal') {
                    addLog(`💊 DOCTOR saved ${target.name}`);
                    updateCoins(15);
                } else if (myRoleAction === 'investigate') {
                    addLog(`🔍 ${target.name} → Role: ${target.role}`);
                    updateCoins(10);
                }
                checkWinCondition(room);
                room.phase = 'day';
                saveRooms();
                updateGameUI();
            }
        }
        selectedPlayerId = null;
        updatePlayersList();
        updateActionButtons();
    }

    function startNightPhase() {
        if (gameState.mode !== 'solo') return;
        gameState.phase = 'night';
        updatePhaseUI();
        addLog('🌙 Night falls...');
        
        const mafias = gameState.players.filter(p => p.role === 'mafia' && p.isAlive);
        const towns = gameState.players.filter(p => p.role !== 'mafia' && p.isAlive && p.id !== currentUser.id);
        
        if (mafias.length > 0 && towns.length > 0) {
            const victim = towns[Math.floor(Math.random() * towns.length)];
            victim.isAlive = false;
            addLog(`🔪 MAFIA killed ${victim.name}!`);
        }
        
        setTimeout(() => {
            gameState.phase = 'day';
            updatePhaseUI();
            addLog('☀️ Day begins! Vote to eliminate Mafia.');
            const mafiaAlive = gameState.players.some(p => p.role === 'mafia' && p.isAlive);
            const townAlive = gameState.players.some(p => p.role !== 'mafia' && p.isAlive);
            if (!mafiaAlive) endGame('🎉 TOWN WINS! +200 coins!', 200);
            else if (!townAlive) endGame('💀 MAFIA WINS!', 0);
            else updatePlayersList();
        }, 2000);
    }

    function checkWinCondition(room) {
        const alive = room.players.filter(p => p.isAlive);
        const mafiaAlive = alive.some(p => p.role === 'mafia');
        const townAlive = alive.some(p => p.role && p.role !== 'mafia');
        if (!mafiaAlive) endGame('🏆 TOWN WINS! +150 coins!', 150);
        else if (!townAlive) endGame('🔪 MAFIA WINS! +100 coins!', 100);
    }

    function endGame(message, coins) {
        gameState.gameStarted = false;
        addLog(message);
        if (coins > 0) updateCoins(coins);
        if (tg.showPopup) tg.showPopup({ title: 'Game Over', message: message, buttons: [{type: 'ok'}] });
        setTimeout(() => location.reload(), 3000);
    }

    function addLog(msg) {
        const logDiv = document.getElementById('gameLog');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `🕐 ${new Date().toLocaleTimeString()} - ${msg}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // ==================== EVENT LISTENERS ====================
    document.getElementById('soloModeBtn').onclick = startSoloMode;
    document.getElementById('duoModeBtn').onclick = () => {
        gameState.mode = 'duo';
        document.getElementById('modeScreen').classList.add('hidden');
        document.getElementById('joinScreen').classList.remove('hidden');
        document.getElementById('joinTitle').innerHTML = '⚔️ DUO MODE (2 Players)';
    };
    document.getElementById('multiModeBtn').onclick = () => {
        gameState.mode = 'multi';
        document.getElementById('modeScreen').classList.add('hidden');
        document.getElementById('joinScreen').classList.remove('hidden');
        document.getElementById('joinTitle').innerHTML = '👥 MULTI MODE (4-6 Players)';
    };
    document.getElementById('backToModeBtn').onclick = () => {
        document.getElementById('joinScreen').classList.add('hidden');
        document.getElementById('modeScreen').classList.remove('hidden');
    };
    document.getElementById('createRoomBtn').onclick = createRoom;
    document.getElementById('joinRoomBtn').onclick = () => {
        const code = document.getElementById('roomCodeInput').value;
        if (code) joinRoom(code);
    };
    
    tg.ready();
</script>
</body>
</html>
