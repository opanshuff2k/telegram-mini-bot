<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐦 Flappy Bird - Telegram Mini Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--tg-theme-bg-color, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', 'Press Start 2P', system-ui, monospace;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            background: linear-gradient(180deg, #4a90e2 0%, #2d5f9e 100%);
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        canvas {
            display: block;
            margin: 0 auto;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* UI Overlay */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .score-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 18px;
            color: #ffd700;
            font-weight: bold;
            font-size: 20px;
            font-family: monospace;
            letter-spacing: 1px;
            border: 1px solid rgba(255,215,0,0.5);
        }

        .best-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 18px;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 20px;
            font-family: monospace;
            border: 1px solid rgba(255,107,107,0.5);
        }

        .user-card {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 12px;
            color: #ccc;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }

        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            z-index: 20;
            display: none;
            min-width: 250px;
            border: 1px solid #ffd700;
            pointer-events: auto;
        }

        .game-over-screen h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .game-over-screen p {
            color: white;
            margin: 10px 0;
            font-size: 18px;
        }

        .game-over-screen .final-score {
            font-size: 42px;
            font-weight: bold;
            color: #ffd700;
        }

        .restart-btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            font-family: monospace;
            transition: transform 0.2s;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .instruction {
            position: absolute;
            bottom: 30%;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div class="game-ui">
        <div class="score-card">🎯 SCORE: <span id="currentScore">0</span></div>
        <div class="best-card">🏆 BEST: <span id="bestScore">0</span></div>
    </div>
    
    <div class="user-card" id="userInfo">👤 Loading...</div>
    
    <div class="instruction">
        ⬆️ TAP anywhere to FLY! ⬆️
    </div>
    
    <div class="game-over-screen" id="gameOverScreen">
        <h2>💀 GAME OVER 💀</h2>
        <p>Your Score</p>
        <div class="final-score" id="finalScoreSpan">0</div>
        <p>🏆 Best: <span id="finalBestSpan">0</span></p>
        <button class="restart-btn" id="restartBtn">🔄 PLAY AGAIN</button>
    </div>
</div>

<script>
    // ----------------------------- TELEGRAM INIT -----------------------------
    const tg = window.Telegram.WebApp;
    tg.expand(); // Full screen mode
    tg.MainButton.hide();
    
    let userTelegramId = 'anonymous';
    let userFirstName = 'Guest';
    
    // Get Telegram User Data
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        userTelegramId = user.id.toString();
        userFirstName = user.first_name || 'Player';
        document.getElementById('userInfo').innerHTML = `👤 ${userFirstName} (ID: ${userTelegramId.slice(-4)})`;
    } else {
        document.getElementById('userInfo').innerHTML = `👤 Guest Mode`;
    }
    
    // ----------------------------- GAME CONSTANTS -----------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game dimensions
    const CANVAS_W = 400;
    const CANVAS_H = 600;
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    
    // Bird
    const BIRD_WIDTH = 34;
    const BIRD_HEIGHT = 24;
    let bird = {
        x: 60,
        y: CANVAS_H / 2,
        width: BIRD_WIDTH,
        height: BIRD_HEIGHT,
        velocity: 0,
        gravity: 0.25,
        jumpPower: -5.2
    };
    
    // Pillars
    const PILLAR_WIDTH = 55;
    const PILLAR_GAP = 150;
    const PILLAR_SPACING = 220;
    let pillars = [];
    
    // Game state
    let score = 0;
    let bestScore = 0;
    let gameRunning = true;
    let frame = 0;
    let animationId = null;
    
    // Load best score from Telegram Cloud Storage (per user)
    const STORAGE_KEY = `flappy_best_${userTelegramId}`;
    
    function loadBestScore() {
        tg.CloudStorage.getItem(STORAGE_KEY, (err, savedBest) => {
            if (!err && savedBest && !isNaN(parseInt(savedBest))) {
                bestScore = parseInt(savedBest);
                document.getElementById('bestScore').innerText = bestScore;
            } else {
                bestScore = 0;
                document.getElementById('bestScore').innerText = '0';
            }
        });
    }
    
    function saveBestScore(newBest) {
        tg.CloudStorage.setItem(STORAGE_KEY, newBest.toString());
        document.getElementById('bestScore').innerText = newBest;
    }
    
    // ----------------------------- GAME FUNCTIONS -----------------------------
    function resetGame() {
        bird.y = CANVAS_H / 2;
        bird.velocity = 0;
        score = 0;
        gameRunning = true;
        document.getElementById('currentScore').innerText = '0';
        document.getElementById('gameOverScreen').style.display = 'none';
        
        // Reset pillars
        pillars = [];
        generateInitialPillars();
        frame = 0;
    }
    
    function generateInitialPillars() {
        for (let i = 0; i < 3; i++) {
            let pillarY = Math.random() * (CANVAS_H - PILLAR_GAP - 100) + 50;
            pillars.push({
                x: CANVAS_W + i * PILLAR_SPACING,
                y: pillarY,
                width: PILLAR_WIDTH,
                gap: PILLAR_GAP,
                counted: false
            });
        }
    }
    
    function addPillar() {
        let pillarY = Math.random() * (CANVAS_H - PILLAR_GAP - 100) + 50;
        pillars.push({
            x: CANVAS_W,
            y: pillarY,
            width: PILLAR_WIDTH,
            gap: PILLAR_GAP,
            counted: false
        });
    }
    
    function updateGame() {
        if (!gameRunning) return;
        
        // Bird physics
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        
        // Boundary collision (top/bottom)
        if (bird.y + BIRD_HEIGHT >= CANVAS_H || bird.y <= 0) {
            gameOver();
            return;
        }
        
        // Update pillars and collision
        for (let i = 0; i < pillars.length; i++) {
            const p = pillars[i];
            p.x -= 2.5; // Move left
            
            // Check collision
            if (bird.x + BIRD_WIDTH > p.x && bird.x < p.x + PILLAR_WIDTH) {
                // Collision with top pillar OR bottom pillar
                if (bird.y < p.y || bird.y + BIRD_HEIGHT > p.y + PILLAR_GAP) {
                    gameOver();
                    return;
                }
            }
            
            // Scoring
            if (!p.counted && p.x + PILLAR_WIDTH < bird.x) {
                p.counted = true;
                score++;
                document.getElementById('currentScore').innerText = score;
                tg.HapticFeedback.impactOccurred('light');
                
                // Update best score
                if (score > bestScore) {
                    bestScore = score;
                    saveBestScore(bestScore);
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }
        
        // Remove offscreen pillars
        pillars = pillars.filter(p => p.x + PILLAR_WIDTH > 0);
        
        // Generate new pillars
        if (pillars.length === 0 || pillars[pillars.length - 1].x < CANVAS_W - PILLAR_SPACING) {
            addPillar();
        }
    }
    
    function gameOver() {
        if (!gameRunning) return;
        gameRunning = false;
        
        tg.HapticFeedback.notificationOccurred('error');
        
        // Show game over screen with stats
        document.getElementById('finalScoreSpan').innerText = score;
        document.getElementById('finalBestSpan').innerText = bestScore;
        document.getElementById('gameOverScreen').style.display = 'block';
        
        // Send score data to bot (optional for analytics)
        tg.sendData(JSON.stringify({
            event: 'game_over',
            score: score,
            best: bestScore,
            userId: userTelegramId
        }));
    }
    
    // ----------------------------- DRAWING -----------------------------
    function drawBackground() {
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        grad.addColorStop(0, '#4a90e2');
        grad.addColorStop(1, '#2d5f9e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(80, 80, 40, 30, 0, 0, Math.PI * 2);
        ctx.ellipse(120, 70, 35, 28, 0, 0, Math.PI * 2);
        ctx.ellipse(300, 150, 50, 35, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    function drawPillars() {
        for (const p of pillars) {
            // Top pillar
            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(p.x, 0, p.width, p.y);
            ctx.fillStyle = '#1b4d3e';
            ctx.fillRect(p.x - 5, p.y - 30, p.width + 10, 30);
            
            // Bottom pillar
            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(p.x, p.y + PILLAR_GAP, p.width, CANVAS_H - (p.y + PILLAR_GAP));
            ctx.fillStyle = '#1b4d3e';
            ctx.fillRect(p.x - 5, p.y + PILLAR_GAP, p.width + 10, 30);
        }
    }
    
    function drawBird() {
        // Rotate bird based on velocity
        let rotation = Math.min(Math.max(bird.velocity * 0.08, -0.5), 0.8);
        
        ctx.save();
        ctx.translate(bird.x + BIRD_WIDTH/2, bird.y + BIRD_HEIGHT/2);
        ctx.rotate(rotation);
        
        // Body
        ctx.fillStyle = '#f4d03f';
        ctx.beginPath();
        ctx.ellipse(0, 0, BIRD_WIDTH/2, BIRD_HEIGHT/2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Eye
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(8, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Beak
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();
        ctx.moveTo(14, -3);
        ctx.lineTo(22, -1);
        ctx.lineTo(14, 1);
        ctx.fill();
        
        ctx.restore();
    }
    
    function drawGround() {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(0, CANVAS_H - 50, CANVAS_W, 50);
        ctx.fillStyle = '#c28a3e';
        for(let i = 0; i < 20; i++) {
            ctx.fillRect(i * 25, CANVAS_H - 55, 10, 8);
        }
    }
    
    function draw() {
        drawBackground();
        drawPillars();
        drawBird();
        drawGround();
    }
    
    // ----------------------------- INPUT HANDLER -----------------------------
    function jump() {
        if (!gameRunning) return;
        bird.velocity = bird.jumpPower;
        // Small upward shift for better feel
        bird.y += bird.velocity * 0.5;
        tg.HapticFeedback.impactOccurred('medium');
    }
    
    // Event listeners (canvas click/tap)
    canvas.addEventListener('click', (e) => {
        e.preventDefault();
        if (gameRunning) jump();
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameRunning) jump();
    });
    
    // Restart button listener
    document.getElementById('restartBtn').addEventListener('click', () => {
        resetGame();
    });
    
    // ----------------------------- GAME LOOP -----------------------------
    function gameLoop() {
        updateGame();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }
    
    // Initialize game
    generateInitialPillars();
    loadBestScore();
    gameLoop();
    
    // Make sure game stops if Telegram app closes
    window.addEventListener('beforeunload', () => {
        if (animationId) cancelAnimationFrame(animationId);
    });
    
    tg.ready();
</script>
</body>
</html>
